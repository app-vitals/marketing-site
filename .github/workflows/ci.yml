name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-lint-test:
    name: build / lint / smoke
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Lint (astro check)
        run: npm run check

      - name: Brand lint (changed blog posts / LinkedIn drafts only)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF" --depth=1
          changed=$(git diff --name-only --diff-filter=d "origin/$BASE_REF" -- src/content/blog content-calendar | grep '\.md$' || true)
          if [ -z "$changed" ]; then
            echo "No blog/LinkedIn content changed — skipping."
          else
            echo "$changed"
            python3 brand/brand-lint.py --brand-dir brand $changed
          fi

      - name: Remove broken google-chrome apt source (known GH Actions runner issue)
        run: |
          sudo grep -rl "dl.google.com" /etc/apt/sources.list.d/ 2>/dev/null | xargs -r sudo rm -f
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright smoke
        run: npm test
