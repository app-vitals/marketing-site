name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  build-lint-test:
    name: build / lint / smoke
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Lint (astro check)
        run: npm run check

      - name: Brand lint (changed blog posts / LinkedIn drafts only)
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          changed=$(git diff --name-only --diff-filter=d "origin/${{ github.base_ref }}" -- src/content/blog content-calendar | grep '\.md$' || true)
          if [ -z "$changed" ]; then
            echo "No blog/LinkedIn content changed — skipping."
          else
            echo "$changed"
            python3 brand/brand-lint.py --brand-dir brand $changed
          fi

      - name: Remove broken google-chrome apt source (known GH Actions runner issue)
        run: |
          sudo grep -rl "dl.google.com" /etc/apt/sources.list.d/ 2>/dev/null | xargs -r sudo rm -f
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright smoke
        run: npm test
